# Codemagic CI for English Fox (Android APK).
#
# Put this file in the ROOT of the Git repository (the top level you see on
# GitHub, next to the README) - Codemagic only looks for it there.
# It works whether the Flutter project (the folder with pubspec.yaml) IS the
# root, or sits one folder deeper (e.g. english_fox/): it finds it itself.
#
# In Codemagic: Add application -> pick the repo -> choose "codemagic.yaml"
# (not "Workflow Editor") -> start the "android-apk" workflow.
# The finished APK is in the build's "Artifacts" section.

workflows:
  android-apk:
    name: English Fox - Android APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Find the Flutter project
        script: |
          PUBSPEC=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found - is the project in this repository?"
            exit 1
          fi
          APP_DIR=$(cd "$(dirname "$PUBSPEC")" && pwd)
          echo "Flutter project: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $CM_ENV

      - name: Get Flutter packages
        script: |
          cd "$APP_DIR"
          flutter pub get

      - name: Static analysis (does not stop the build)
        script: |
          cd "$APP_DIR"
          flutter analyze
        ignore_failure: true

      - name: Run tests (does not stop the build)
        script: |
          cd "$APP_DIR"
          flutter test
        ignore_failure: true

      - name: Build release APK
        script: |
          cd "$APP_DIR"
          # versionName / versionCode come from "version:" in pubspec.yaml
          # (e.g. 0.7.0+7). Android only installs an APK over an older one
          # if the number after "+" is higher, so raise it for every release.
          flutter build apk --release

    artifacts:
      - '**/build/app/outputs/flutter-apk/*.apk'
