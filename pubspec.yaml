name: english_fox
description: English Fox - a story-driven English learning game for children ages 5-9.
publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
  assets:
    - assets/
    - assets/words/
    - assets/fonts/
    - assets/sounds/
    - assets/pets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app-icon.png
  adaptive_icon_background: '#35A9F4'
  adaptive_icon_foreground: assets/app-icon.png



